name: 缺陷报告
description: 报告一个可以复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前先确认用的是最新版本，旧版本的问题可能已经修复。

  - type: input
    id: version
    attributes:
      label: 版本
      description: App 内显示的版本号
      placeholder: 2.3-lite.4（versionCode 16）
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 设备型号和 Android 版本
      placeholder: step neo / Android 14
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动 App 开始，一步一步写，写清楚第几步开始不对
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错信息或 audit.jsonl 里的相关记录，贴在这里
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已经试过最新版本
          required: true
        - label: 这个问题不涉及安全漏洞（涉及的话请走私密渠道）
          required: true
